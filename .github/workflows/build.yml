name: Build CPython for Android

on:
  workflow_dispatch:
    inputs:
      cpython_ref:
        description: "CPython git tag/ref to build (e.g. v3.14.7)"
        required: true
        default: "v3.14.7"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GNU target triples, as accepted by CPython's own Android/android.py
        # (NOT the Gradle-style ABI names like "arm64-v8a"/"x86_64").
        host:
          - aarch64-linux-android
          - x86_64-linux-android
    env:
      CPYTHON_REF: ${{ github.event.inputs.cpython_ref || 'v3.14.7' }}
    steps:
      - name: Set up JDK (needed by the Android SDK's sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android.py auto-installs its own pinned NDK version (currently
      # 27.3.13750724, read from cpython/Android/android-env.sh) via
      # sdkmanager, as long as ANDROID_HOME points at a valid SDK with
      # cmdline-tools -- already true on GitHub's hosted Ubuntu runners.
      # This just makes sure the SDK licenses are pre-accepted so that
      # auto-install step doesn't block on an interactive prompt.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
            done
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "sdkmanager not found on PATH -- relying on android.py's own auto-install"
          fi

      - name: Check out CPython
        run: git clone --branch "$CPYTHON_REF" --depth 1 https://github.com/python/cpython.git cpython

      # "build" takes a positional `target` (all/build/hosts/<HOST triple>),
      # defaulting to "all". Passing a specific host triple directly (as a
      # first try here did) skips build_targets()'s own
      # `if context.target in {"all", "build"}:` branch that builds the
      # build-platform "helper" Python -- and configure/make-host then fails
      # immediately since that helper tree doesn't exist yet. So this needs
      # two separate invocations: "build" first (builds only the helper),
      # then the specific host (now that the helper it depends on exists).
      - name: Build build-platform Python (cross-compilation helper)
        working-directory: cpython/Android
        run: ./android.py build build

      - name: Build ${{ matrix.host }}
        working-directory: cpython/Android
        run: ./android.py build ${{ matrix.host }}

      - name: Package ${{ matrix.host }}
        working-directory: cpython/Android
        run: ./android.py package ${{ matrix.host }}

      # NOTE: cross-build/ lives directly under cpython/ (the repo root),
      # NOT under cpython/Android/ -- confirmed from the Package step's own
      # printed "Wrote .../cpython/cross-build/<host>/dist/....tar.gz" line,
      # after an earlier version of this workflow got this wrong (looked
      # for it under cpython/Android/cross-build/ instead) and failed here
      # with "No such file or directory".
      - name: Locate package
        id: pkg
        working-directory: cpython
        run: |
          PKG=$(ls cross-build/${{ matrix.host }}/dist/python-*-${{ matrix.host }}.tar.gz)
          echo "path=$(pwd)/$PKG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$PKG")" >> "$GITHUB_OUTPUT"

      # Consumers embed this .so into apps built with their OWN, possibly
      # different, NDK version. That's fine for the C embedding API (Python.h
      # is a plain C API, ABI-stable across NDK versions) -- the one thing
      # that WOULD matter is if this .so dynamically depends on a shared
      # libc++_shared.so, since then its version would need to match whatever
      # libc++_shared.so the consuming app bundles. android-env.sh's own
      # build flags (no ANDROID_STL=c++_shared, -Wl,--no-undefined) suggest
      # it doesn't -- this step confirms that concretely on every build
      # instead of relying on that inference.
      - name: Verify libpython has no shared libc++ dependency
        working-directory: cpython
        run: |
          SO=$(find cross-build/${{ matrix.host }} -name 'libpython3.*.so' -not -path '*/dist/*' | head -1)
          echo "Checking $SO"
          readelf -d "$SO" | tee /tmp/needed.txt
          if grep -q 'libc++_shared\.so' /tmp/needed.txt; then
            echo "::warning::libpython.so depends on libc++_shared.so -- consumers must match its libc++_shared.so version exactly, not just the ABI/API level."
          else
            echo "OK: no libc++_shared.so dependency -- safe to link against apps built with a different NDK version."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # GitHub defaults new repos' auto-issued GITHUB_TOKEN to read-only
    # permissions -- softprops/action-gh-release needs contents: write to
    # create the release (and, with generate_release_notes: true, to call
    # the "generate release notes" API), or it fails with "Resource not
    # accessible by integration".
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract CPython version from an artifact filename
        id: ver
        run: |
          NAME=$(basename "$(ls dist/*/python-*.tar.gz | head -1)")
          # python-3.14.7-aarch64-linux-android.tar.gz -> 3.14.7
          VERSION=$(echo "$NAME" | sed -E 's/^python-([0-9.]+)-.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          name: "CPython ${{ steps.ver.outputs.version }} for Android"
          body: |
            Prebuilt `libpython3.x.so` + standard library for Android,
            cross-compiled via CPython's own official Android build support
            (`Android/android.py`, [PEP 738](https://peps.python.org/pep-0738/)) --
            see this repo's README for what's in each tarball and how to use it.

            - **CPython version:** ${{ steps.ver.outputs.version }}
            - **Targets:** `aarch64-linux-android` (arm64-v8a, real devices),
              `x86_64-linux-android` (emulators)
            - **Minimum Android API level:** 24
            - **NDK version used to build:** pinned by CPython itself in
              `Android/android-env.sh` at this tag (currently 27.3.13750724) --
              this is independent of whatever NDK version your own app is built
              with; `libpython.so` has no dependency on a shared `libc++_shared.so`
              (verified by this workflow's own `readelf` check on every build), so
              there's no ABI conflict to worry about there.
            - **License:** the tarball contents are CPython itself, unmodified,
              under the [PSF License](https://docs.python.org/3/license.html).
              This repo's own build scripts are MIT-licensed.

            Not yet used in production by anything -- first consumer in progress
            is [Vivace](https://github.com/Sportacandy/vivace) (YouTube URL
            resolution on Android via an embedded interpreter running yt-dlp's
            own pure-Python release, since Android can't execute a downloaded
            native binary).
          generate_release_notes: true
