name: Build CPython for Android

on:
  workflow_dispatch:
    inputs:
      cpython_ref:
        description: "CPython git tag/ref to build (e.g. v3.14.7)"
        required: true
        default: "v3.14.7"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GNU target triples, as accepted by CPython's own Android/android.py
        # (NOT the Gradle-style ABI names like "arm64-v8a"/"x86_64").
        host:
          - aarch64-linux-android
          - x86_64-linux-android
    env:
      CPYTHON_REF: ${{ github.event.inputs.cpython_ref || 'v3.14.7' }}
    steps:
      - name: Set up JDK (needed by the Android SDK's sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android.py auto-installs its own pinned NDK version (currently
      # 27.3.13750724, read from cpython/Android/android-env.sh) via
      # sdkmanager, as long as ANDROID_HOME points at a valid SDK with
      # cmdline-tools -- already true on GitHub's hosted Ubuntu runners.
      # This just makes sure the SDK licenses are pre-accepted so that
      # auto-install step doesn't block on an interactive prompt.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if [ -x "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
            done
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "sdkmanager not found on PATH -- relying on android.py's own auto-install"
          fi

      - name: Check out CPython
        run: git clone --branch "$CPYTHON_REF" --depth 1 https://github.com/python/cpython.git cpython

      # "build" takes a positional `target` (all/build/hosts/<HOST triple>),
      # defaulting to "all". Passing a specific host triple directly (as a
      # first try here did) skips build_targets()'s own
      # `if context.target in {"all", "build"}:` branch that builds the
      # build-platform "helper" Python -- and configure/make-host then fails
      # immediately since that helper tree doesn't exist yet. So this needs
      # two separate invocations: "build" first (builds only the helper),
      # then the specific host (now that the helper it depends on exists).
      - name: Build build-platform Python (cross-compilation helper)
        working-directory: cpython/Android
        run: ./android.py build build

      - name: Build ${{ matrix.host }}
        working-directory: cpython/Android
        run: ./android.py build ${{ matrix.host }}

      - name: Package ${{ matrix.host }}
        working-directory: cpython/Android
        run: ./android.py package ${{ matrix.host }}

      - name: Locate package
        id: pkg
        working-directory: cpython/Android
        run: |
          PKG=$(ls cross-build/${{ matrix.host }}/dist/python-*-${{ matrix.host }}.tar.gz)
          echo "path=$(pwd)/$PKG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$PKG")" >> "$GITHUB_OUTPUT"

      # Consumers embed this .so into apps built with their OWN, possibly
      # different, NDK version. That's fine for the C embedding API (Python.h
      # is a plain C API, ABI-stable across NDK versions) -- the one thing
      # that WOULD matter is if this .so dynamically depends on a shared
      # libc++_shared.so, since then its version would need to match whatever
      # libc++_shared.so the consuming app bundles. android-env.sh's own
      # build flags (no ANDROID_STL=c++_shared, -Wl,--no-undefined) suggest
      # it doesn't -- this step confirms that concretely on every build
      # instead of relying on that inference.
      - name: Verify libpython has no shared libc++ dependency
        working-directory: cpython/Android
        run: |
          SO=$(find cross-build/${{ matrix.host }} -name 'libpython3.*.so' -not -path '*/dist/*' | head -1)
          echo "Checking $SO"
          readelf -d "$SO" | tee /tmp/needed.txt
          if grep -q 'libc++_shared\.so' /tmp/needed.txt; then
            echo "::warning::libpython.so depends on libc++_shared.so -- consumers must match its libc++_shared.so version exactly, not just the ABI/API level."
          else
            echo "OK: no libc++_shared.so dependency -- safe to link against apps built with a different NDK version."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true
